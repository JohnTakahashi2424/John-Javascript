<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema Académico</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/alertify.min.css" />
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/default.min.css" />
    <!-- Semantic UI theme -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/semantic.min.css" />
</head>

<body>
    <div id="app">
        <!-- NAVBAR SUPERIOR -->
        <nav class="navbar border-bottom bg-body-tertiary px-3 shadow-sm" style="height: 56px;">
            <div class="container-fluid px-0">
                <div class="navbar-brand d-flex align-items-center gap-2 mb-0">
                    <i class="bi bi-mortarboard-fill fs-4 text-primary"></i>
                    <span class="fw-bold text-body" style="font-size: 1.1rem;">SISTEMA ACADÉMICO</span>
                </div>

                <div class="d-flex align-items-center gap-3">
                    <button class="btn btn-sm btn-outline-secondary border-0" @click="toggleDarkMode">
                        <i :class="darkMode ? 'bi bi-sun-fill text-warning' : 'bi bi-moon-stars-fill'"></i>
                    </button>
                    <span class="badge bg-primary bg-opacity-10 text-primary border border-primary px-2 py-1">
                        <i class="bi bi-person-badge me-1"></i> {{ sesion.rol }}
                    </span>
                    <span class="text-body small fw-semibold">
                        <i class="bi bi-person-circle me-1 text-primary"></i> {{ sesion.username }}
                    </span>
                </div>
            </div>
        </nav>

        <div class="container-fluid">
            <div class="row">
                <!-- SIDEBAR -->
                <nav class="col-md-2 d-md-block bg-body-tertiary border-end min-vh-100 pt-3">
                    <ul class="nav flex-column gap-1 px-2">
                        <li class="nav-item" v-for="(label, key) in {alumnos:'Alumnos', materias:'Materias', docentes:'Docentes', matriculas:'Matriculas', inscripciones:'Inscripciones'}" :key="key">
                            <a class="nav-link rounded d-flex align-items-center gap-2 px-3 py-2 transition-all"
                               :class="forms[key].mostrar ? 'active bg-primary bg-opacity-10 text-primary fw-bold border border-primary border-opacity-25' : 'text-body-secondary'"
                               href="#" @click.prevent="abrirVentana(key)">
                                <i :class="'bi bi-' + (key=='alumnos'?'people':key=='materias'?'book':key=='docentes'?'person-workspace':key=='matriculas'?'card-checklist':'pencil-square')"></i>
                                {{ label }}
                            </a>
                        </li>
                    </ul>
                </nav>

                <!-- CONTENIDO PRINCIPAL -->
                <main class="col-md-10 ms-sm-auto px-4 py-4">
                    <div v-if="!Object.values(forms).some(f => f.mostrar)" class="text-center mt-5 opacity-25">
                        <i class="bi bi-mortarboard" style="font-size: 4rem;"></i>
                        <h5 class="mt-3">Seleccione un módulo para comenzar</h5>
                    </div>

                    <alumnos @buscar='buscar("busqueda_alumnos","obtenerAlumnos")' :forms="forms" ref="alumnos" v-show="forms.alumnos.mostrar"></alumnos>
                    <busqueda_alumnos @modificar='modificar("alumnos","modificarAlumno", $event)' ref="busqueda_alumnos" v-show="forms.busqueda_alumnos.mostrar"></busqueda_alumnos>

                    <materias @buscar='buscar("busqueda_materias","obtenerMaterias")' :forms="forms" ref="materias" v-show="forms.materias.mostrar"></materias>
                    <busqueda_materias @modificar='modificar("materias","modificarMateria", $event)' ref="busqueda_materias" v-show="forms.busqueda_materias.mostrar"></busqueda_materias>

                    <docentes @buscar='buscar("busqueda_docentes","obtenerDocentes")' :forms="forms" ref="docentes" v-show="forms.docentes.mostrar"></docentes>
                    <busqueda_docentes @modificar='modificar("docentes","modificarDocente", $event)' ref="busqueda_docentes" v-show="forms.busqueda_docentes.mostrar"></busqueda_docentes>

                    <matriculas @buscar='buscar("busqueda_matriculas","obtenerMatriculas")' :forms="forms" ref="matriculas" v-show="forms.matriculas.mostrar"></matriculas>
                    <busqueda_matriculas @modificar='modificar("matriculas","modificarMatricula", $event)' ref="busqueda_matriculas" v-show="forms.busqueda_matriculas.mostrar"></busqueda_matriculas>

                    <inscripciones @buscar='buscar("busqueda_inscripciones","obtenerInscripciones")' :forms="forms" ref="inscripciones" v-show="forms.inscripciones.mostrar"></inscripciones>
                    <busqueda_inscripciones @modificar='modificar("inscripciones","modificarInscripcion", $event)' ref="busqueda_inscripciones" v-show="forms.busqueda_inscripciones.mostrar"></busqueda_inscripciones>
                </main>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.1.1/crypto-js.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/alertify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dexie/4.2.0/dexie.min.js"
        integrity="sha512-LuXLH9xON6/aAGYxi4Z1Dx8588Z80gY3iMmGtUlYmblUc1ulC/cGHuANXIvm8fnIWp5ShUk2MRBIWylGguXF9g=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="componentes/alumnos.js"></script>
    <script src="componentes/busqueda_alumnos.js"></script>
    <script src="componentes/materias.js"></script>
    <script src="componentes/busqueda_materias.js"></script>
    <script src="componentes/docentes.js"></script>
    <script src="componentes/busqueda_docentes.js"></script>
    <script src="componentes/matriculas.js"></script>
    <script src="componentes/busqueda_matriculas.js"></script>
    <script src="componentes/inscripciones.js"></script>
    <script src="componentes/busqueda_inscripciones.js"></script>
    <script src="main.js"></script>
</body>

</html>
