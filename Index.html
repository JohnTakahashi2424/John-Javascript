<!doctype html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Académico — Premium</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/alertify.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --sidebar-w: 260px; --accent: #3b82f6; --glass: rgba(255,255,255,0.75); }
        [data-bs-theme="dark"] { --glass: rgba(15,23,42,0.85); --accent: #60a5fa; }
        
        body { font-family: 'Outfit', sans-serif; background: #f1f5f9; transition: background 0.4s; overflow-x: hidden; }
        /* Adaptive Premium Navbar */
        .navbar { 
            background: var(--glass) !important; 
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            padding: 0.7rem 1.5rem; z-index: 101;
            transition: 0.3s;
        }
        [data-bs-theme="dark"] .navbar { border-bottom-color: rgba(255,255,255,0.05); }
        .navbar-brand, .nav-user-info, .navbar .btn-link { color: var(--bs-body-color) !important; opacity: 1 !important; }
        .navbar .vr { background-color: var(--bs-body-color); opacity: 0.2; }
        
        .navbar-brand { font-size: 1.1rem; letter-spacing: 0.5px; }
        
        .sidebar {
            width: var(--sidebar-w); min-height: 100vh; background: var(--glass); 
            backdrop-filter: blur(12px); border-right: 1px solid rgba(0,0,0,0.05); 
            position: fixed; z-index: 100; transition: 0.3s;
        }
        [data-bs-theme="dark"] .sidebar { border-right-color: rgba(255,255,255,0.05); }
        
        .nav-link {
            padding: 12px 20px; margin: 5px 15px; border-radius: 12px;
            color: var(--bs-body-color); display: flex; align-items: center; gap: 12px; transition: 0.3s;
        }
        .nav-link:hover { background: rgba(59,130,246,0.1); transform: translateX(5px); }
        .nav-link.active { 
            background: var(--accent); color: #fff !important; 
            box-shadow: 0 8px 20px -6px var(--accent); font-weight: 600;
        }
        
        .app-main { margin-left: var(--sidebar-w); padding: 2.5rem; transition: 0.3s; }
        
        .card { 
            border: none; border-radius: 20px; background: var(--glass);
            backdrop-filter: blur(10px); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); 
        }
        [data-bs-theme="dark"] .card { border: 1px solid rgba(255,255,255,0.08); }
        
        .btn { border-radius: 10px; padding: 10px 24px; font-weight: 600; transition: 0.3s; }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.1); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        
        /* Custom Utils */
        .ls-1 { letter-spacing: 1px; }
        .fw-boldest { font-weight: 800; }
        .transition-all { transition: all 0.3s ease; }
        .cursor-pointer { cursor: pointer; }
        
        /* Animación de giro para el botón de recarga */
        .spinning {
            animation: spin 0.8s ease-in-out;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .app-main { margin-left: 0; }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- NAVBAR GLASS -->
        <nav class="navbar sticky-top shadow-none border-0">
            <div class="container-fluid px-4">
                <a class="navbar-brand fw-bold d-flex align-items-center gap-3" href="#">
                    <div class="bg-primary rounded-4 p-2 d-flex shadow-sm" style="--bs-bg-opacity: .9;"><i class="bi bi-mortarboard-fill text-white fs-5"></i></div>
                    <span class="d-none d-sm-inline ls-1 fw-boldest">SISTEMA ACADÉMICO</span>
                </a>
                <div class="ms-auto d-flex align-items-center gap-4">
                    <button class="btn btn-sm btn-link p-0 opacity-70 hover-opacity-100 transition-all border-0 shadow-none text-body" title="Recargar App" @click="recargarApp">
                        <i class="bi bi-arrow-clockwise fs-5 d-inline-block" :class="{ 'spinning': isRefreshing }"></i>
                    </button>
                    <button class="btn btn-sm btn-link p-0 opacity-70 hover-opacity-100 transition-all border-0 shadow-none text-body" title="Cambiar Tema" @click="toggleDarkMode">
                        <i :class="darkMode?'bi-sun-fill text-warning':'bi-moon-stars-fill'" class="bi fs-5"></i>
                    </button>
                    <div class="vr bg-body opacity-20" style="height: 25px;"></div>
                    <div class="d-flex align-items-center gap-3 nav-user-info">
                        <div class="text-end d-none d-md-block text-body">
                            <div class="small fw-bold lh-1">{{sesion.username}}</div>
                            <div class="opacity-50 mt-1" style="font-size:0.6rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 700;">{{sesion.rol}}</div>
                        </div>
                        <div class="bg-secondary bg-opacity-10 rounded-circle p-1 d-flex border border-secondary border-opacity-10">
                            <i class="bi bi-person-circle fs-3 text-secondary opacity-90"></i>
                        </div>
                    </div>
                </div>
            </div>
        </nav>

        <div class="d-flex">
            <aside class="sidebar pt-4 d-none d-md-block shadow-sm">
                <div class="px-4 mb-3 small fw-bold text-uppercase opacity-50" style="letter-spacing:1px">Menu Principal</div>
                <div class="nav flex-column">
                    <a v-for="(label, key) in {alumnos:'Alumnos', materias:'Materias', docentes:'Docentes', matriculas:'Matriculas', inscripciones:'Inscripciones'}" 
                       class="nav-link" :class="{active: forms[key].mostrar}" href="#" @click.prevent="abrirVentana(key)">
                        <i :class="'bi bi-' + (key=='alumnos'?'people':key=='materias'?'book':key=='docentes'?'briefcase':key=='matriculas'?'check-circle':'pencil-square')"></i>
                        {{label}}
                    </a>
                </div>
            </aside>

            <main class="app-main w-100">
                <div v-if="!Object.values(forms).some(f => f.mostrar)" class="text-center mt-5 py-5 rounded-5 card mx-auto" style="max-width: 800px;">
                    <div class="bg-primary bg-opacity-10 d-inline-block p-4 rounded-circle mb-4">
                        <i class="bi bi-rocket-takeoff text-primary fs-1"></i>
                    </div>
                    <h2 class="fw-bold px-3">Bienvenido al Portal Académico Premium</h2>
                    <p class="text-muted fs-5 px-4 mt-2">Usa el menú lateral para gestionar los registros de la plataforma.</p>
                </div>
                
                <div class="forms-container">
                    <alumnos v-show="forms.alumnos.mostrar" @buscar='buscar("busqueda_alumnos","obtenerAlumnos")' :forms="forms" ref="alumnos"></alumnos>
                    <busqueda_alumnos v-show="forms.busqueda_alumnos.mostrar" @regresar="irAVentana($event)" @modificar='modificar("alumnos","modificarAlumno", $event)' ref="busqueda_alumnos"></busqueda_alumnos>
                    <materias v-show="forms.materias.mostrar" @buscar='buscar("busqueda_materias","obtenerMaterias")' :forms="forms" ref="materias"></materias>
                    <busqueda_materias v-show="forms.busqueda_materias.mostrar" @regresar="irAVentana($event)" @modificar='modificar("materias","modificarMateria", $event)' ref="busqueda_materias"></busqueda_materias>
                    <docentes v-show="forms.docentes.mostrar" @buscar='buscar("busqueda_docentes","obtenerDocentes")' :forms="forms" ref="docentes"></docentes>
                    <busqueda_docentes v-show="forms.busqueda_docentes.mostrar" @regresar="irAVentana($event)" @modificar='modificar("docentes","modificarDocente", $event)' ref="busqueda_docentes"></busqueda_docentes>
                    <matriculas v-show="forms.matriculas.mostrar" @buscar='buscar("busqueda_matriculas","obtenerMatriculas")' :forms="forms" ref="matriculas"></matriculas>
                    <busqueda_matriculas v-show="forms.busqueda_matriculas.mostrar" @regresar="irAVentana($event)" @modificar='modificar("matriculas","modificarMatricula", $event)' ref="busqueda_matriculas"></busqueda_matriculas>
                    <inscripciones v-show="forms.inscripciones.mostrar" @buscar='buscar("busqueda_inscripciones","obtenerInscripciones")' :forms="forms" ref="inscripciones"></inscripciones>
                    <busqueda_inscripciones v-show="forms.busqueda_inscripciones.mostrar" @regresar="irAVentana($event)" @modificar='modificar("inscripciones","modificarInscripcion", $event)' ref="busqueda_inscripciones"></busqueda_inscripciones>
                </div>
            </main>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/alertify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.1.1/crypto-js.min.js"></script>
    <script src="Database.js?v=2"></script>
    <script src="componentes/alumnos.js?v=14"></script>
    <script src="componentes/busqueda_alumnos.js?v=14"></script>
    <script src="componentes/materias.js?v=14"></script>
    <script src="componentes/busqueda_materias.js?v=14"></script>
    <script src="componentes/docentes.js?v=14"></script>
    <script src="componentes/busqueda_docentes.js?v=14"></script>
    <script src="componentes/matriculas.js?v=14"></script>
    <script src="componentes/busqueda_matriculas.js?v=14"></script>
    <script src="componentes/inscripciones.js?v=14"></script>
    <script src="componentes/busqueda_inscripciones.js?v=14"></script>
    <script src="main.js?v=15"></script>
</body>
</html>
